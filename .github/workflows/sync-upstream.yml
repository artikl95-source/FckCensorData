name: Sync upstream + regenerate combined list

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream list
        run: curl -fsSL "https://raw.githubusercontent.com/Hazzz895/FckCensorData/refs/heads/main/list_v2.json" -o upstream_list.json

      # raw.githubusercontent lags minutes behind fresh commits — fetch our own
      # files via the contents API (always fresh) so the merge never sees stale data
      - name: Fetch custom list via API
        run: curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/contents/custom/custom_v2.json?ref=main" | python3 -c "import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)['content']).decode('utf-8'))" > custom_v2.json

      - name: Fetch custom meta via API
        run: curl -fsSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/${{ github.repository }}/contents/custom/meta.json?ref=main" | python3 -c "import sys,json,base64;print(base64.b64decode(json.load(sys.stdin)['content']).decode('utf-8'))" > meta.json

      - name: Fetch fork README
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md" -o README.md

      - name: Fetch scripts
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/merge_custom.py" -o merge_custom.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/regen_readme.py" -o regen_readme.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/commit_via_api.py" -o commit_via_api.py

      - name: Regenerate combined list
        run: python3 merge_custom.py

      - name: Regenerate README
        run: python3 regen_readme.py

      - name: Commit via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 commit_via_api.py
