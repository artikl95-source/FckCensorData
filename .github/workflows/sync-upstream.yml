name: Sync upstream + regenerate combined list

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream list
        run: curl -fsSL "https://raw.githubusercontent.com/Hazzz895/FckCensorData/refs/heads/main/list_v2.json" -o upstream_list.json

      - name: Fetch custom list
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/custom/custom_v2.json" -o custom_v2.json

      - name: Fetch custom meta
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/custom/meta.json" -o meta.json

      - name: Fetch fork README
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/README.md" -o README.md

      - name: Fetch scripts
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/merge_custom.py" -o merge_custom.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/regen_readme.py" -o regen_readme.py
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/scripts/commit_via_api.py" -o commit_via_api.py

      - name: Regenerate combined list
        run: python3 merge_custom.py

      - name: Regenerate README
        run: python3 regen_readme.py

      - name: Commit via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: python3 commit_via_api.py
