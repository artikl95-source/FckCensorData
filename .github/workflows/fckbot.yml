name: FckBot (Telegram)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch bot script
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/.github/scripts/fckbot.js" -o fckbot.js

      - name: Poll Telegram and process tracks
        env:
          TG_TOKEN: ${{ secrets.FCKBOT_TG_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: node fckbot.js
